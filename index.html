    <script>
        // Shim serasi: sediakan QRCode.toDataURL (API pakej 'qrcode') di atas qrcode-generator
        window.QRCode = {
            toDataURL: function(text, opts) {
                return new Promise(function(resolve, reject) {
                    try {
                        opts = opts || {};
                        var qr = qrcode(0, opts.errorCorrectionLevel || 'M');
                        qr.addData(text);
                        qr.make();
                        var size = opts.width || 220;
                        var cellSize = Math.max(1, Math.floor(size / qr.getModuleCount()));
                        var marginPx = Math.max(0, Math.floor((opts.margin || 1) * cellSize));
                        resolve(qr.createDataURL(cellSize, marginPx));
                    } catch (e) { reject(e); }
                });
            }
        };
    </script>

        // Setiap Jumaat menjadi satu sesi kehadiran maya dengan ID 'pmi-YYYY-MM-DD'
        // supaya data setiap minggu tersimpan berasingan dan tersusun.
        const PMI_MAX_WEEKS = 18;
        window.getPMIWeeks = (year, session) => {
            const y = parseInt(year) || new Date().getFullYear();
            const start = session === 'jan-jun' ? new Date(y, 0, 1) : new Date(y, 6, 1);
            const end = session === 'jan-jun' ? new Date(y, 5, 30) : new Date(y, 11, 31);
            const d = new Date(start);
            while (d.getDay() !== 5) d.setDate(d.getDate() + 1); // cari Jumaat pertama
            const weeks = [];
            let n = 1;
            while (d <= end && n <= PMI_MAX_WEEKS) {
                const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                weeks.push({ id: 'pmi-' + iso, week: n, date: iso });
                d.setDate(d.getDate() + 7);
                n++;
            }
            return weeks;
        };

            if (sid.startsWith('pmi-')) {
                const date = sid.slice(4);
                const dt = new Date(date + 'T00:00:00');
                if (isNaN(dt)) return null;
                const session = dt.getMonth() < 6 ? 'jan-jun' : 'julai-dis';
                const w = window.getPMIWeeks(dt.getFullYear(), session).find(x => x.date === date);
                return {
                    id: sid,
                    title: 'Pembangunan Modal Insan (PMI)',
                    date: date,
                    time: '',
                    location: 'Surau Serambi Ar-Raudhah',
                    category: 'PMI',
                    status: 'Published',
                    year: String(dt.getFullYear()),
                    session: session,
                    week: w ? w.week : null
                };
            }
            return (DB.programs || []).find(p => String(p.id) === sid) || null;

                    const isRound = chart.config.type === 'pie' || chart.config.type === 'doughnut';
                    chart.data.datasets.forEach((ds, di) => {

                            ctx.save();

        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxIuw3myLP5WzAuHz1IKe1LBJMDR6cZBLgr8ANP6HP1HWS-QMpLZBqh-CH_zrQwngLK/exec';
        (function installGasShim() {
            if (typeof google !== 'undefined' && google.script && google.script.run) return; // di dalam GAS — guna asal
            if (!GAS_API_URL) return;
            const callApi = (action, args, okFn, failFn) => {
                try {
                    // Pastikan rekod objek mempunyai id (supaya id lokal == id pelayan)
                    if (args && args[0] && typeof args[0] === 'object' && !Array.isArray(args[0]) && !args[0].id && !/^(get|verify)/.test(action) && action !== 'updateRecord' && action !== 'deleteRecord') {
                        args[0].id = action.replace(/^save|^submit|^record/, '').toLowerCase() + '_' + Date.now();
                    }
                    const argsJson = JSON.stringify(args || []);
                    const qs = '?action=' + encodeURIComponent(action) + '&args=' + encodeURIComponent(argsJson) + '&t=' + Date.now();
                    if (qs.length < 5500) {
                        fetch(GAS_API_URL + qs)
                            .then(r => r.json())
                            .then(d => {
                                if (d && d.success) { if (okFn) okFn(d.result); }
                                else if (failFn) failFn(new Error((d && d.error) || 'API error'));
                            })
                            .catch(e => { if (failFn) failFn(e); else if (okFn) okFn(null); });
                    } else {
                        // Payload besar (gambar base64): POST no-cors — respons legap tetapi tulisan diproses pelayan
                        fetch(GAS_API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: action, args: args }) })
                            .then(() => setTimeout(() => {
                                if (okFn) okFn({ success: true, id: (args[0] && args[0].id) || undefined, image: (args[0] && args[0].image) || undefined });
                            }, 1500))
                            .catch(e => { if (failFn) failFn(e); else if (okFn) okFn(null); });
                    }
                } catch (e) { if (failFn) failFn(e); }
            };
            window.google = {
                script: {
                    get run() {
                        let okFn = null, failFn = null;
                        const runner = new Proxy({}, {
                            get(t, prop) {
                                if (prop === 'withSuccessHandler') return (f) => { okFn = f; return runner; };
                                if (prop === 'withFailureHandler') return (f) => { failFn = f; return runner; };
                                return (...args) => callApi(prop, args, okFn, failFn);

                const now = new Date();
                const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
                const order = [['subuh','Subuh'], ['zohor','Zohor'], ['asar','Asar'], ['maghrib','Maghrib'], ['isyak','Isyak']];

            window.doPromote(true);
        };

        // Fungsi teras promosi. allDepartments = true bermaksud abaikan tapisan jabatan.
        window.doPromote = (allDepartments) => {
            // Baca nilai terkini dari form
            state.promoteDept = document.getElementById('promote-dept')?.value || '';
            state.promoteSem = document.getElementById('promote-sem')?.value || '';
            state.promoteYear = document.getElementById('promote-year')?.value || '';
            state.promoteSession = document.getElementById('promote-session')?.value || '';
            state.promoteToSem = document.getElementById('promote-to-sem')?.value || '';
            state.promoteToYear = document.getElementById('promote-to-year')?.value || '';
            state.promoteToSession = document.getElementById('promote-to-session')?.value || '';

            if (!state.promoteToSem || !state.promoteToYear || !state.promoteToSession) {
                showToast('Sila pilih semester, tahun dan sesi baharu.', 'error');
                return;
            }

            const btn = document.getElementById(allDepartments ? 'btn-promote-all' : 'btn-promote');
            const btnLabel = allDepartments ? '<i class="fas fa-layer-group"></i> Naikkan Semua Jabatan' : '<i class="fas fa-arrow-right"></i> Naikkan Pelajar';
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Memproses...'; }

            const formData = {
                fromDept: allDepartments ? '' : state.promoteDept,
                fromSemester: state.promoteSem,
                fromYear: state.promoteYear,
                fromSession: state.promoteSession,
                toSemester: state.promoteToSem,
                toYear: state.promoteToYear,
                toSession: state.promoteToSession
            };

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (result && result.success) {
                            showToast(`${result.copied} pelajar berjaya disalin ke ${state.promoteToSem} (${state.promoteToSession} ${state.promoteToYear}).`, 'success');
                            google.script.run
                                .withSuccessHandler(function(students) {
                                    if (students && students.length > 0) DB.students = students;
                                    if (btn) { btn.disabled = false; btn.innerHTML = btnLabel; }
                                    router();
                                })
                                .getStudents();
                        } else {
                            showToast('Gagal menaikkan pelajar: ' + (result.error || 'ralat'), 'error');
                            if (btn) { btn.disabled = false; btn.innerHTML = btnLabel; }
                        }
                    })
                    .withFailureHandler(function(err) {
                        showToast('Ralat: ' + (err.message || err), 'error');
                        if (btn) { btn.disabled = false; btn.innerHTML = btnLabel; }
                    })
                    .promoteStudents(formData);
            } else {
                // Fallback tempatan (untuk ujian paparan)
                const students = DB.students || [];
                const matched = students.filter(s =>
                    (!formData.fromDept || s.dept === formData.fromDept) &&
                    (!formData.fromSemester || s.semester === formData.fromSemester) &&
                    (!formData.fromYear || String(s.year) === String(formData.fromYear)) &&
                    (!formData.fromSession || s.session === formData.fromSession)
                );
                let copied = 0;
                matched.forEach(s => {
                    const exists = students.some(x => x.name === s.name && x.dept === s.dept && x.semester === state.promoteToSem && String(x.year) === String(state.promoteToYear) && x.session === state.promoteToSession);
                    if (!exists) {
                        DB.students.push({ ...s, id: 's_' + Date.now() + '_' + copied, semester: state.promoteToSem, year: state.promoteToYear, session: state.promoteToSession });
                        copied++;
                    }
                });
                showToast(`${copied} pelajar berjaya disalin (tempatan).`, 'success');
                if (btn) { btn.disabled = false; btn.innerHTML = btnLabel; }
                router();
            }
        };

        // Modal detail pelajar (semua maklumat) - untuk ADMIN

                            <div class="bg-gray-50 rounded-xl p-3 border"><p class="text-[10px] font-bold text-gray-400 uppercase mb-0.5">Semester</p><p class="font-bold text-gray-900 text-sm">${s.semester || '-'}</p></div>
                            <div class="bg-gray-50 rounded-xl p-3 border"><p class="text-[10px] font-bold text-gray-400 uppercase mb-0.5">No. Telefon</p><p class="font-bold text-gray-900 text-sm">${s.phone || '-'}</p></div>

            document.body.appendChild(modal);
        };

        // === PENUKARAN TARIKH HIJRAH (Umm al-Qura style, anggaran tepat) ===
        const HIJRI_MONTHS = ['Muharram', 'Safar', 'Rabiulawal', 'Rabiulakhir', 'Jamadilawal', 'Jamadilakhir', 'Rejab', 'Syaaban', 'Ramadan', 'Syawal', 'Zulkaedah', 'Zulhijjah'];

        // Tukar tarikh Gregorian kepada Hijri (array [hYear, hMonth(0-11), hDay]).
        // Menggunakan algoritma integer (tabular Islamic calendar).
        window.gregorianToHijri = (gy, gm, gd) => {
            // gy: tahun penuh, gm: bulan 0-index, gd: hari (1-index)
            const a = Math.floor((14 - (gm + 1)) / 12);
            const y = gy + 4800 - a;
            const m = (gm + 1) + 12 * a - 3;
            // Julian Day Number
            const jd = gd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;

            // Islamic tabular calendar
            const l = jd - 1948440 + 10632;
            const n = Math.floor((l - 1) / 10631);
            const l2 = l - 10631 * n + 354;
            const j = Math.floor((10985 - l2) / 5316) * Math.floor((50 * l2) / 17719) + Math.floor(l2 / 5670) * Math.floor((43 * l2) / 15238);
            const l3 = l2 - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
            const hm = Math.floor((24 * l3) / 709);
            const hd = l3 - Math.floor((709 * hm) / 24);
            const hy = 30 * n + j - 30;
            return [hy, hm - 1, hd];
        };

        window.getHijriDate = (year, month, day) => {
            // month: 0-index, day: 1-index
            const [hy, hm, hd] = window.gregorianToHijri(year, month, day);
            return `${hd} ${HIJRI_MONTHS[hm]}`;
        };

        // === PANGKALAN DATA PERISTIWA ISLAM & CUTI UMUM MALAYSIA ===
        // Tarikh peristiwa Islam bergantung pada cerapan bulan (rukyah) dan berubah
        // setiap tahun. Nilai di bawah ialah ANGGARAN 2026 berdasarkan pengiraan
        // takwim tabular; ADMIN PERLU SEMAK takwim rasmi JAKIM setiap tahun.
        const ISLAMIC_EVENTS = {
            '2026-02-18': { name: 'Awal Ramadan', type: 'islam' },
            '2026-03-16': { name: 'Nuzul Al-Quran', type: 'islam' },
            '2026-03-20': { name: 'Hari Raya Aidilfitri', type: 'islam' },
            '2026-03-21': { name: 'Hari Raya Aidilfitri (2)', type: 'islam' },
            '2026-05-27': { name: 'Hari Raya Aidiladha', type: 'islam' },
            '2026-06-17': { name: 'Awal Muharram (Maal Hijrah)', type: 'islam' },
            '2026-08-26': { name: 'Maulidur Rasul', type: 'islam' },
            '2026-02-15': { name: 'Israk dan Mikraj', type: 'islam' }
        };

        const PUBLIC_HOLIDAYS = {
            // Cuti umum tetap Malaysia
            '2026-01-01': { name: 'Tahun Baharu', type: 'cuti' },
            '2026-05-01': { name: 'Hari Pekerja', type: 'cuti' },
            '2026-06-01': { name: 'Hari Keputeraan YDP Agong', type: 'cuti' },

            '2026-12-25': { name: 'Hari Krismas', type: 'cuti' }
        };

        // Gabung semua acara untuk carian pantas mengikut tarikh
        const getAllEvents = () => ({ ...ISLAMIC_EVENTS, ...PUBLIC_HOLIDAYS });

        window.getEventForDate = (dateKey) => {
            const all = getAllEvents();
            return all[dateKey] || null;
        };

        // === WAKTU SOLAT BINTULU (Zon SWK03, API e-solat JAKIM) ===
        // 1) Cuba melalui backend Apps Script (elak CORS).
        // 2) Jika gagal, cuba fetch terus.
        // 3) Jika masih gagal (tiada internet), guna jadual anggaran.
        window.loadPrayerTimes = async () => {
            const container = document.getElementById('prayer-times');
            if (container) container.innerHTML = '<div class="text-center text-gray-400 text-sm py-4"><i class="fas fa-spinner fa-spin mr-1"></i> Memuatkan waktu solat...</div>';

            const renderFallback = () => {
                // Anggaran SWK03 Bintulu (jika tiada talian)
                const fallback = { imsak: '04:53', subuh: '05:03', syuruk: '06:12', zohor: '12:15', asar: '15:32', maghrib: '18:16', isyak: '19:25' };
                window.renderPrayerTimes(fallback, 'Anggaran (tiada talian)');
            };

            // Cuba melalui backend Apps Script
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                try {
                    const zone = 'SWK03'; // Zon tetap Bintulu
                    const result = await new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(resolve)
                            .withFailureHandler(reject)
                            .getPrayerTimes(zone);
                    });
                    if (result && result.success && result.times) {
                        window.renderPrayerTimes(result.times, result.date || 'Hari Ini');
                        return;
                    }
                } catch (e) { /* teruskan ke fallback seterusnya */ }
            }

            // Cuba fetch terus (zon tetap SWK03 = Bintulu)
            try {
                const zone = 'SWK03';
                const res = await fetch('https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=today&zone=' + zone + '&t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.status === 'OK!' && data.prayerTime && data.prayerTime.length) {
                        const t = data.prayerTime[0];
                        const short = (s) => s ? String(s).split(':').slice(0, 2).join(':') : '';
                        window.renderPrayerTimes({
                            imsak: short(t.imsak), subuh: short(t.fajr), syuruk: short(t.syuruk),
                            zohor: short(t.dhuhr), asar: short(t.asr), maghrib: short(t.maghrib), isyak: short(t.isha)
                        }, (t.date || 'Hari Ini') + ' · e-Solat JAKIM ' + zone);
                        return;
                    }
                }
            } catch (e) { /* teruskan ke fallback */ }

            renderFallback();
        };

        window.renderPrayerTimes = (times, dateLabel) => {
            // Simpan secara global supaya pil "Solat Seterusnya" berfungsi di SEMUA halaman
            window.__ptTimes = times;
            window.__ptLabel = dateLabel || '';
            window.__ptFetchedAt = Date.now();
            window.updatePrayerPill && window.updatePrayerPill();

            const container = document.getElementById('prayer-times');
            if (!container) return;
            const labels = [
                { key: 'imsak', label: 'Imsak', icon: 'fa-clock' },
                { key: 'subuh', label: 'Subuh', icon: 'fa-cloud-moon' },
                { key: 'syuruk', label: 'Syuruk', icon: 'fa-sun' },
                { key: 'zohor', label: 'Zohor', icon: 'fa-sun' },
                { key: 'asar', label: 'Asar', icon: 'fa-cloud-sun' },
                { key: 'maghrib', label: 'Maghrib', icon: 'fa-cloud-sun-rain' },
                { key: 'isyak', label: 'Isyak', icon: 'fa-moon' }
            ];
            // Tentukan waktu semasa (kad aktif)
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const toMin = (s) => { const p = String(s || '0:0').split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1] || 0, 10); };
            let currentIdx = -1;
            labels.forEach((l, i) => { if (times[l.key] && toMin(times[l.key]) <= nowMin) currentIdx = i; });

            container.innerHTML = labels.map((l, i) => `
                <div class="flex items-center justify-between py-2.5 border-b border-gray-100 last:border-0 ${i === currentIdx ? 'bg-primary-50/60 -mx-2 px-2 rounded-lg' : ''}">
                    <span class="text-sm ${i === currentIdx ? 'text-primary-800 font-bold' : 'text-gray-600'} flex items-center gap-2"><i class="fas ${l.icon} ${i === currentIdx ? 'text-primary-600' : 'text-primary-400'} w-4"></i>${l.label}${i === currentIdx ? '<span class="text-[9px] bg-primary-600 text-white px-1.5 py-0.5 rounded-full uppercase">Sekarang</span>' : ''}</span>
                    <span class="font-bold ${i === currentIdx ? 'text-primary-800' : 'text-gray-900'} text-sm">${times[l.key] || '-'}</span>
                </div>
            `).join('') + (dateLabel ? `<p class="text-[10px] text-gray-400 text-right mt-1">${dateLabel}</p>` : '');

            // Kira solat seterusnya & pasang countdown
            const order = ['subuh', 'zohor', 'asar', 'maghrib', 'isyak'];
            const names = { subuh: 'Subuh', zohor: 'Zohor', asar: 'Asar', maghrib: 'Maghrib', isyak: 'Isyak' };
            let nextName = 'Subuh', nextDate = null;
            for (const k of order) {
                if (times[k] && toMin(times[k]) > nowMin) {
                    nextName = names[k];
                    nextDate = new Date(); nextDate.setHours(parseInt(times[k].split(':')[0], 10), parseInt(times[k].split(':')[1] || 0, 10), 0, 0);
                    break;
                }
            }
            if (!nextDate && times.subuh) {
                // Semua solat hari ini berlalu — sasaran Subuh esok
                nextDate = new Date(Date.now() + 86400000);
                nextDate.setHours(parseInt(times.subuh.split(':')[0], 10), parseInt(times.subuh.split(':')[1] || 0, 10), 0, 0);
            }
            const cdEl = document.getElementById('next-prayer-cd');
            if (cdEl && nextDate) {
                document.getElementById('next-prayer-name').textContent = nextName;
                cdEl.setAttribute('data-cd', nextDate.toISOString());
                if (window.startCountdowns) window.startCountdowns();
            }
        };

        window.renderTakwimGrid = (year, month, context = 'public') => {
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Header hari (Ahad - Sabtu)
            const dayNames = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            let html = `<div class="min-w-[560px]">

                const hasGallery = DB.galleries.find(g => g.date === dateKey);
                const specialEvent = window.getEventForDate(dateKey);
                const hijri = window.getHijriDate(year, month, day);
                const isToday = (year === today.getFullYear() && month === today.getMonth() && day === today.getDate());
                const isWeekend = (new Date(year, month, day).getDay() === 0) || (new Date(year, month, day).getDay() === 6);

                // Tentukan gaya sel
                let classes = 'relative min-h-[70px] sm:min-h-[90px] rounded-xl border p-1.5 sm:p-2 flex flex-col transition duration-200 overflow-hidden group ';
                let onclickAttr = '';

                if (hasGallery) {
                    classes += 'bg-white border-primary-300 shadow-sm cursor-pointer hover:shadow-lg hover:-translate-y-0.5 ';
                    onclickAttr = `onclick="window.showProgramInfo('${dateKey}')"`;
                } else if (hasEvent) {
                    classes += 'bg-primary-50/60 border-primary-300 ring-1 ring-primary-400 cursor-pointer hover:shadow-lg hover:-translate-y-0.5 ';
                    onclickAttr = `onclick="window.showProgramInfo('${dateKey}')"`;
                } else if (specialEvent && specialEvent.type === 'islam') {

                    classes += 'bg-blue-50 border-blue-400 ring-2 ring-blue-500 ';
                } else if (isWeekend) {
                    classes += 'bg-gray-50/80 border-gray-200 ';
                } else {
                    classes += 'bg-white border-gray-200 hover:border-primary-300 hover:bg-primary-50/30 ';
                }

                if (!hasEvent && !hasGallery && context === 'admin' && !specialEvent) {
                    classes += ' cursor-pointer';
                    onclickAttr = `onclick="window.selectTakwimDate('${dateKey}')"`;
                }

                // Latar belakang galeri (mini photo)
                let bgImageHtml = '';
                if (hasGallery) {
                    bgImageHtml = `<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40 group-hover:opacity-70 transition duration-300" style="background-image: url('${hasGallery.url}');"></div><div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent z-0"></div>`;
                }

                // Paparan nombor hari
                const dayNumBg = hasGallery ? 'bg-black/50 text-white rounded-full w-6 h-6 flex items-center justify-center font-black' : isToday ? 'bg-blue-600 text-white rounded-full w-6 h-6 flex items-center justify-center font-black' : 'font-black text-gray-700';

                // Badge acara khas
                let badgeHtml = '';
                if (specialEvent) {
                    const isIslam = specialEvent.type === 'islam';
                    badgeHtml = `<span title="${specialEvent.name}" class="text-[8px] sm:text-[9px] font-bold leading-tight px-1 py-0.5 rounded ${isIslam ? 'bg-amber-500 text-white' : 'bg-red-500 text-white'} line-clamp-1 break-words"><i class="fas ${isIslam ? 'fa-mosque' : 'fa-flag'} mr-0.5"></i>${specialEvent.name}</span>`;
                }

                // Ikon penunjuk gambar (mini photo indicator)
                const photoIcon = hasGallery ? `<span class="absolute top-1.5 right-1.5 text-white/90 text-[10px] bg-black/40 rounded-full w-5 h-5 flex items-center justify-center z-10"><i class="fas fa-camera"></i></span>` : '';

                html += `<div class="${classes}" ${onclickAttr}>
                    ${bgImageHtml}
                    ${photoIcon}
                    <div class="flex justify-between items-start w-full relative z-10">
                        <span class="text-xs sm:text-sm ${dayNumBg}">${day}</span>
                        <span class="text-[7px] sm:text-[8px] font-semibold ${hasGallery ? 'text-white/90' : 'text-gray-400'} leading-tight text-right">${hijri}</span>
                    </div>
                    <div class="mt-auto relative z-10 flex flex-col gap-1 w-full">

            AdminReports: async () => {
                const year = state.filterYear; const session = state.filterSession;
                const progressList = DB.studentProgress.filter(p => String(p.year) === String(year) && p.session === session);
                const studentsList = DB.students.filter(s => String(s.year) === String(year) && s.session === session);
                
                setTimeout(() => {
                    const deptLabels = []; const attendanceData = [];
                    const __charts = [];
                    DB.departments.forEach(d => {
                        deptLabels.push(d.name);
                        const deptStudents = studentsList.filter(s => s.dept === d.name);
                        if (deptStudents.length === 0) {
                            attendanceData.push(0);
                        } else {
                            const deptStudentNames = deptStudents.map(s => s.name);
                            const attended = progressList.filter(p => deptStudentNames.includes(p.mentee));
                            const uniqueAttended = [...new Set(attended.map(p => p.mentee))];
                            const percent = Math.round((uniqueAttended.length / deptStudents.length) * 100);
                            attendanceData.push(percent);
                        }
                    });
                    const ctx1 = document.getElementById('chart-dept');
                    if(ctx1) __charts.push(new Chart(ctx1, { type: 'bar', data: { labels: deptLabels, datasets: [{ label: 'Kehadiran Mentee (%)', data: attendanceData, backgroundColor: '#059669', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } } }));

                    const progCounts = { 'Iqra\'': 0, 'Al-Quran': 0, 'Lain-lain': 0 };
                    progressList.forEach(p => {
                        const pr = (p.level || '').toLowerCase();
                        if(pr.includes('iqra')) progCounts['Iqra\'']++;
                        else if(pr.includes('quran')) progCounts['Al-Quran']++;
                        else progCounts['Lain-lain']++;
                    });
                    const ctx2 = document.getElementById('chart-prog');
                    if(ctx2) __charts.push(new Chart(ctx2, { type: 'doughnut', data: { labels: Object.keys(progCounts), datasets: [{ data: Object.values(progCounts), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b'] }] }, options: { responsive: true, maintainAspectRatio: false } }));

                    // Carta pai: tahap bacaan pelajar berdaftar (Al-Quran / Iqra')
                    const levelCounts = { "Al-Quran": 0, "Iqra'": 0, 'Belum Ditentukan': 0 };
                    studentsList.forEach(s => {
                        const lv = (s.level || '').toLowerCase();
                        if (lv.includes('iqra')) levelCounts["Iqra'"]++;
                        else if (lv.includes('quran')) levelCounts["Al-Quran"]++;
                        else levelCounts['Belum Ditentukan']++;
                    });
                    const ctx3 = document.getElementById('chart-level');
                    if(ctx3) {
                        const chLevel = new Chart(ctx3, {
                            type: 'pie',
                            data: { labels: Object.keys(levelCounts), datasets: [{ data: Object.values(levelCounts), backgroundColor: ['#10b981', '#3b82f6', '#94a3b8'], borderWidth: 2, borderColor: '#ffffff' }] },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11, weight: 'bold' } } }, tooltip: { callbacks: { label: (c) => ` ${c.label}: ${c.parsed} pelajar (${Math.round(c.parsed / Math.max(1, studentsList.length) * 100)}%)` } } } }
                        });
                        __charts.push(chLevel);
                        // Paksa lukis semula selepas susun atur stabil (elak canvas kosong pada telefon/tablet)
                        setTimeout(() => window.forceChartDraw(__charts), 400);
                        setTimeout(() => window.forceChartDraw(__charts), 1200);
                    }
                }, 100);

                return Views.AdminLayout(`
                    <div class="flex justify-between items-center mb-6 flex-wrap gap-4 no-print">
                        <h1 class="text-2xl font-black text-gray-900">Laporan & Statistik</h1>
                        <div class="flex gap-2">
                            <a href="#admin-sijil" class="bg-primary-600 hover:bg-primary-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2">
                                <i class="fas fa-certificate"></i> Jana E-Sijil
                            </a>
                            <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2">
                                <i class="fas fa-print"></i> Cetak Laporan
                            </button>
                        </div>
                    </div>
                    <div id="printable-report" class="space-y-6">
                        <div class="print-header" style="text-align:center; border-bottom:3px double #059669; padding-bottom:12px; margin-bottom:16px;">

                            <p style="font-size:11px; color:#555;">${DB.settings.address} · ${DB.settings.phone}</p>
                        </div>
                        <div class="text-center">
                            <h2 class="text-xl font-bold text-gray-900 border-b pb-3">Laporan Prestasi & Kehadiran Mentee (${session.toUpperCase()} ${year})</h2>

                        </div>

                                <div class="h-72 w-full"><canvas id="chart-dept"></canvas></div>

            if(btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...'; }

            const finish = (finalImg) => {
                // finalImg ialah base64 data URL (jika fail dipilih) atau URL sedia ada
                const formData = {

                    phone: phoneNorm,

                    semester,

                    level, 
                    year: String(year), 
                    session,

                    image: finalImg || '',

        window.saveGallery = (e, id = '') => {
            e.preventDefault(); const form = e.target; 
            const btn = form.querySelector('button[type="submit"]'); if(btn) { btn.disabled = true; btn.innerHTML = 'Menyimpan...'; }
            const file = form.elements['image'].files[0]; 
            let imgUrl = id ? (DB.galleries.find(x => x.id === id)?.url || '') : '';
            const hasBackend = typeof google !== 'undefined' && google.script && google.script.run;

            const finish = (url) => {
                const base = { title: form.elements['title'].value, date: form.elements['date'].value, year: state.filterYear, session: state.filterSession, updatedBy: actorName() };

                if(id) {
                    // EDIT: hantar kunci 'url' (sepadan dengan kolom sheet Galleries).
                    // Jika url ialah base64 (gambar baharu dipilih), backend updateRecord
                    // akan memuat naik ke Drive dan pulangkan URL Drive.
                    const data = { ...base, url: url };

                    if (!hasBackend) {
                        const idx = DB.galleries.findIndex(x => x.id === id);
                        if(idx !== -1) DB.galleries[idx] = { id, ...data };
                        showToast('Gambar berjaya dikemaskini (tempatan)!', 'success');
                        form.closest('.fixed').remove();
                        router();
                        return;
                    }
                    google.script.run
                        .withSuccessHandler(function(result) {
                            if (result && result.success) {
                                const idx = DB.galleries.findIndex(x => x.id === id);
                                if(idx !== -1) DB.galleries[idx] = { id, ...data };
                            }
                            showToast('Gambar berjaya dikemaskini!', 'success');
                            form.closest('.fixed').remove();
                            router();
                        })
                        .withFailureHandler(function(err) {
                            showToast('Ralat kemaskini gambar: ' + (err.message || err), 'error');
                            if(btn) { btn.disabled = false; btn.innerHTML = 'Simpan'; }
                        })
                        .updateRecord('Galleries', id, data);
                } else {
                    // TAMBAH BAHARU: hantar 'image' (base64) untuk upload Drive oleh saveGallery().
                    const data = { ...base, image: url };

                    if (!hasBackend) {
                        DB.galleries.push({ id: 'g_' + Date.now(), ...base, url: url });
                        showToast('Gambar berjaya direkodkan (tempatan)!', 'success');
                        form.closest('.fixed').remove();
                        router();
                        return;
                    }
                    google.script.run
                        .withSuccessHandler(function(result) {
                            const savedUrl = (result && result.url) ? result.url : url;
                            DB.galleries.push({ id: (result && result.id) ? result.id : data.id, ...base, url: savedUrl });
                            showToast('Gambar berjaya direkodkan!', 'success');
                            form.closest('.fixed').remove();
                            router();
                        })
                        .withFailureHandler(function(err) {
                            showToast('Ralat menyimpan gambar: ' + (err.message || err), 'error');
                            if(btn) { btn.disabled = false; btn.innerHTML = 'Simpan'; }
                        })
                        .saveGallery(data);
                }
            };
            
            if(file) { 
                const reader = new FileReader(); 
                reader.onload = (ev) => finish(ev.target.result); 
                reader.onerror = () => { showToast('Ralat gambar', 'error'); finish(imgUrl); }; 
                reader.readAsDataURL(file); 
            } else { finish(imgUrl); }
        };

            const doLoginSuccess = (found) => {
                resetBtn();

                    state.currentUser = found;

            if (typeof google !== 'undefined' && google.script && google.script.run) {

                    .verifyLogin(user, pass);

        // ================= FACE RECOGNITION (KEHAADIRAN) =================
        const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';

        let faceModelsLoaded = false;
        let faceStream = null;
        let scanActive = false;
        let scanInterval = null;
        let faceMatcher = null;

        window.loadFaceModels = async () => {
            if (typeof faceapi === 'undefined') throw new Error('FaceAPI belum dimuat. Semak sambungan internet.');
            if (faceModelsLoaded) return;
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)
            ]);
            faceModelsLoaded = true;
        };

        // Bina FaceMatcher dari descriptor yang tersimpan
        const buildFaceMatcher = () => {
            const descriptors = DB.faceDescriptors || [];
            const labeled = descriptors.map(d => {
                try {
                    const arr = typeof d.descriptor === 'string' ? JSON.parse(d.descriptor) : d.descriptor;
                    return new faceapi.LabeledFaceDescriptors(String(d.studentId), [new Float32Array(arr)]);
                } catch (e) { return null; }
            }).filter(Boolean);
            // threshold: nilai lebih kecil = lebih ketat (hanya padanan sangat rapat diterima).
            // 0.55 adalah kompromi baik untuk elak salah kenal & elak terlalu banyak 'unknown'.
            faceMatcher = labeled.length ? new faceapi.FaceMatcher(labeled, 0.55) : null;
            return faceMatcher;
        };

        window.setScanProgram = (id) => {
            state.attendanceProgram = id;
            // Kemaskini senarai hadir tanpa reload (jangan ganggu kamera aktif)
            if (typeof window.refreshScanAttendees === 'function') window.refreshScanAttendees();
            const infoEl = document.getElementById('scan-program-info');
            if (infoEl) {
                const p = window.resolveProgram(id);
                infoEl.innerHTML = p ? `<i class="fas fa-calendar mr-1"></i>${formatDate(p.date)} · ${p.time || ''}` : '';
            }
        };

        window.selectAttendanceProgram = (id) => {
            state.attendanceProgram = id;
            router();
        };

        const getCameraStream = async (videoId) => {
            const video = document.getElementById(videoId);
            if (!video) throw new Error('Elemen video tidak ditemui.');

            // Semak sokongan mediaDevices
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('Browser anda tidak menyokong kamera. Sila guna Chrome, Edge, atau Safari versi terkini.');
            }

            // Semak persekitaran selamat (HTTPS atau localhost)
            const isSecure = window.isSecureContext || window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if (!isSecure) {
                throw new Error('Kamera hanya berfungsi pada HTTPS atau localhost. Sila deploy aplikasi ke Google Apps Script (URL https://script.google.com).');
            }

            // Hentikan stream lama
            if (faceStream) { faceStream.getTracks().forEach(t => t.stop()); }

            // Senarai tetapan kamera (cuba satu persatu jika gagal)
            const constraintsList = [
                { video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false },
                { video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false },
                { video: { facingMode: 'user' }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            let lastError = null;

            for (const constraints of constraintsList) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (stream) break;
                } catch (err) {
                    lastError = err;
                }
            }

            if (!stream) {
                if (lastError && (lastError.name === 'NotAllowedError' || lastError.name === 'PermissionDeniedError')) {
                    const isGasFrame = window.location.hostname.includes('google.com') || window.location.hostname.includes('googleusercontent.com');
                    throw new Error(isGasFrame
                        ? 'Kamera disekat oleh bingkai Google Apps Script (tiada pop-up kebenaran akan keluar). Sila guna pautan GitHub Pages untuk fungsi kamera: https://nas9270.github.io/surau-dato-tvm-btu/'
                        : 'Kebenaran kamera ditolak. Sila klik ikon kamera/kunci pada bar alamat browser dan benarkan akses kamera, kemudian cuba semula.');
                } else if (lastError && lastError.name === 'NotFoundError') {
                    throw new Error('Tiada kamera dikesan pada peranti ini. Sila pastikan kamera disambungkan dan berfungsi.');
                } else if (lastError && lastError.name === 'NotReadableError') {
                    throw new Error('Kamera sedang digunakan oleh aplikasi lain. Sila tutup aplikasi lain dan cuba semula.');
                }
                throw new Error('Tidak dapat mengakses kamera: ' + (lastError ? lastError.message : 'ralat tidak diketahui'));
            }

            faceStream = stream;
            video.srcObject = stream;
            try { await video.play(); } catch (e) { /* autoplay mungkin disekat, teruskan */ }
            return video;
        };

        const stopCamera = () => {
            if (faceStream) { faceStream.getTracks().forEach(t => t.stop()); faceStream = null; }
            const v = document.getElementById('scan-video') || document.getElementById('enroll-video');
            if (v) v.srcObject = null;
        };

        // AUTO-PENDAFTARAN WAJAH: jana descriptor dari gambar pendaftaran pelajar
        // (pelajar yang sudah muat naik gambar tidak perlu daftar wajah berasingan)
        window.autoEnrollFromPhotos = async (onProgress) => {
            const existing = new Set((DB.faceDescriptors || []).map(d => String(d.studentId)));
            const targets = (DB.students || []).filter(s => s.image && !existing.has(String(s.id)));
            if (!targets.length) return { done: 0, total: 0 };
            let done = 0, failed = 0;
            for (let i = 0; i < targets.length; i++) {
                const s = targets[i];
                if (onProgress) onProgress(i + 1, targets.length, s.name);
                try {
                    const img = await faceapi.fetchImage(s.image);
                    const det = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                        .withFaceLandmarks().withFaceDescriptor();
                    if (det && det.descriptor) {
                        const rec = { studentId: s.id, name: s.name, dept: s.dept, descriptor: JSON.stringify(Array.from(det.descriptor)) };
                        const idx = DB.faceDescriptors.findIndex(d => String(d.studentId) === String(s.id));
                        if (idx !== -1) DB.faceDescriptors[idx] = rec; else DB.faceDescriptors.push(rec);
                        // Simpan ke Sheets (tanpa tunggu)
                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            try { google.script.run.saveFaceDescriptor(rec); } catch (e) {}
                        }
                        done++;
                    } else { failed++; }
                } catch (e) { failed++; console.warn('Auto-daftar wajah gagal:', s.name, e); }
            }
            return { done, total: targets.length, failed };
        };

        window.startFaceScan = async () => {
            const programId = state.attendanceProgram;
            if (!programId) { showToast('Sila pilih program dahulu.', 'error'); return; }
            const statusEl = document.getElementById('scan-status');

            // Guard: elak imbasan berganda (klik 2x)
            if (scanActive) { showToast('Imbasan sedang berjalan.', 'info'); return; }

            const btn = document.getElementById('btn-start-scan');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Memulakan...'; }

            try {
                await window.loadFaceModels();
                buildFaceMatcher();

                // AUTO-PENDAFTARAN: jika ada pelajar bergambar tanpa data wajah, jana dari gambar pendaftaran
                const existingSet = new Set((DB.faceDescriptors || []).map(d => String(d.studentId)));
                const perluDaftar = (DB.students || []).filter(s => s.image && !existingSet.has(String(s.id))).length;
                if (perluDaftar > 0) {
                    if (statusEl) statusEl.textContent = 'Menjana data wajah dari gambar pendaftaran...';
                    showToast(`Menjana data wajah ${perluDaftar} pelajar dari gambar pendaftaran (sekali sahaja)...`, 'info');
                    const hasil = await window.autoEnrollFromPhotos((i, total, nama) => {
                        if (statusEl) statusEl.textContent = `Menjana wajah ${i}/${total}: ${nama}`;
                    });
                    buildFaceMatcher();
                    if (hasil.done > 0) showToast(`${hasil.done} wajah berjaya didaftar automatik dari gambar pendaftaran.`, 'success');
                    if (hasil.failed > 0) showToast(`${hasil.failed} gambar tidak dapat dibaca wajahnya — pelajar berkenaan masih boleh daftar wajah manual.`, 'error');
                }

                if (!faceMatcher) { showToast('Tiada wajah berdaftar. Pastikan pelajar ada gambar pendaftaran, atau daftar wajah manual.', 'error'); if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> Mula Imbasan'; } return; }
                const video = await getCameraStream('scan-video');
                // Tunggu sehingga metadata video tersedia (dengan timeout 10 saat)
                if (video.readyState < 2) {
                    await new Promise((res, rej) => {
                        const timeout = setTimeout(() => { video.onloadeddata = null; rej(new Error('Kamera terlalu lama untuk dimulakan.')); }, 10000);
                        video.onloadeddata = () => { clearTimeout(timeout); res(); };
                    });
                }
                scanActive = true;
                if (statusEl) statusEl.textContent = 'Imbasan aktif...';
                showToast('Imbasan kehadiran dimulakan.', 'success');
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> Mula Imbasan'; }

                const canvas = document.getElementById('scan-overlay');
                const displaySize = { width: video.videoWidth || 640, height: video.videoHeight || 480 };
                faceapi.matchDimensions(canvas, displaySize);

                // Peta ID -> nama untuk label kotak yang mesra pengguna
                const nameMap = {};
                (DB.students || []).forEach(s => { nameMap[String(s.id)] = s.name; });

                // Guard in-flight: elak hantar rekod sama berkali-kali dalam frame berturut-turut
                const inFlight = new Set();

                scanInterval = setInterval(async () => {
                    if (!scanActive) return;
                    try {
                        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                            .withFaceLandmarks()
                            .withFaceDescriptors();
                        const resized = faceapi.resizeResults(detections, displaySize);
                        const resizedDetections = resized.detections || resized;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        faceapi.draw.drawDetections(canvas, resizedDetections);

                        for (const det of resizedDetections) {
                            const best = faceMatcher.findBestMatch(det.descriptor);
                            const isKnown = best.label !== 'unknown';
                            // Papar nama pelajar (bukan ID mentah) pada kotak
                            const label = isKnown ? (nameMap[best.label] || best.label) : 'Tidak dikenali';
                            const color = isKnown ? 'green' : 'red';
                            new faceapi.draw.DrawBox(det.detection.box, { label: label, boxColor: color }).draw(canvas);

                            // Wajah tidak dikenali → papar mesej gagal + butang Cuba Semula (maksimum sekali setiap 10 saat)
                            if (!isKnown) {
                                const now = Date.now();
                                if (now - (window.__lastScanFail || 0) > 10000 && !document.getElementById('scan-result-overlay')) {
                                    window.__lastScanFail = now;
                                    window.showScanResult(false, 'Wajah tidak dikenali. Cuba hadap kamera dengan jelas.');
                                }
                            }

                            if (isKnown && !inFlight.has(best.label)) {
                                inFlight.add(best.label);
                                try {
                                    await window.markAttendance(best.label);
                                } finally {
                                    // Lepaskan selepas beberapa saat supaya rekod semak duplikasi server masih berfungsi
                                    setTimeout(() => inFlight.delete(best.label), 5000);
                                }
                            }
                        }
                    } catch (e) { /* abaikan ralat frame */ }
                }, 1500);
            } catch (e) {
                if (statusEl) statusEl.textContent = 'Ralat: ' + e.message;
                showToast('Ralat kamera: ' + (e.message || e), 'error');
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> Mula Imbasan'; }
            }
        };

        window.stopFaceScan = () => {
            scanActive = false;
            if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
            stopCamera();
            const statusEl = document.getElementById('scan-status');

        // Paparan besar keputusan imbasan — berjaya (5 saat, hijau) / gagal (merah + Cuba Semula) / sudah direkod (biru, 5 saat)

        window.markAttendance = (studentId) => {
            const programId = state.attendanceProgram;
            const program = window.resolveProgram(programId);
            const student = DB.students.find(s => String(s.id) === String(studentId));
            if (!program || !student) return Promise.resolve(false);

            const formData = {
                programId: program.id,
                programTitle: program.title,
                studentId: student.id,
                name: student.name,
                dept: student.dept,
                date: new Date().toLocaleDateString('en-CA'), // tarikh SEBENAR imbasan dilakukan (bukan tarikh program)
                programDate: program.date,                    // tarikh program (rujukan)
                year: program.year,
                session: program.session,
                updatedBy: actorName()
            };

            // Simpan ke memori serta-merta
            const already = (DB.attendance || []).some(a => String(a.programId) === String(programId) && String(a.studentId) === String(studentId));
            if (already) {
                // Imbasan kali kedua untuk program sama — maklum sudah selesai (auto tutup 5 saat)
                window.showScanResult('done', student.name);
                return Promise.resolve(false);
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                return new Promise((resolve) => {
                    google.script.run
                        .withSuccessHandler(function(result) {
                            if (result && result.success) {
                                DB.attendance.push({ id: result.id, ...formData, time: new Date().toLocaleTimeString('en-GB'), status: 'Hadir' });
                                window.refreshScanAttendees();
                                showToast(`${student.name} hadir!`, 'success');
                                window.showScanResult(true, student.name);
                            } else if (result && result.error === 'duplicate') {
                                // sudah hadir di pelayan (imbasan kali kedua)
                                window.showScanResult('done', student.name);
                            }
                            resolve(true);
                        })
                        .withFailureHandler(function() {
                            // OFFLINE: simpan dalam gilir & sync bila talian kembali
                            if (!window.__attQueue) window.__attQueue = [];
                            window.__attQueue.push(formData);
                            try { localStorage.setItem('surau_att_queue', JSON.stringify(window.__attQueue)); } catch (e) {}
                            DB.attendance.push({ id: 'att_' + Date.now(), ...formData, time: new Date().toLocaleTimeString('en-GB'), status: 'Hadir' });
                            window.refreshScanAttendees();
                            showToast(`${student.name} hadir! (offline — akan diselaraskan)`, 'info');
                            window.showScanResult(true, student.name, '(offline)');
                            resolve(true);
                        })
                        .recordAttendance(formData);
                });
            } else {
                // Fallback tempatan
                DB.attendance.push({ id: 'att_' + Date.now(), ...formData, time: new Date().toLocaleTimeString('en-GB'), status: 'Hadir' });
                window.refreshScanAttendees();
                showToast(`${student.name} hadir!`, 'success');
                window.showScanResult(true, student.name);
                return Promise.resolve(true);

        // === SUSUNAN PELAJAR & BIODATA ===
        // Bilangan semester mengikut jenis program:
        // Diploma (DEE, DIK, DOL) = 6 semester; Sijil (SFS, SFP, SPE) = 4 semester
        const DIPLOMA_DEPTS = ['DEE', 'DIK', 'DOL'];
        window.getMaxSemester = (dept) => DIPLOMA_DEPTS.includes(String(dept || '').toUpperCase()) ? 6 : 4;

        // Nombor semester daripada label cth 'Sem 2' -> 2
        const semNum = (s) => parseInt(String(s.semester || '').replace(/\D/g, '')) || 99;

        // Susun pelajar: mengikut jabatan (turutan DEPARTMENTS_LIST), dalam jabatan mulakan Sem 1
        window.sortStudentsByDept = (list) => {
            return [...list].sort((a, b) => {
                const da = DEPARTMENTS_LIST.indexOf(a.dept), db = DEPARTMENTS_LIST.indexOf(b.dept);
                const oa = da === -1 ? 99 : da, ob = db === -1 ? 99 : db;
                if (oa !== ob) return oa - ob;
                const sa = semNum(a), sb = semNum(b);
                if (sa !== sb) return sa - sb;
                return String(a.name || '').localeCompare(String(b.name || ''));
            });
        };

                            <p class="text-xs font-black text-amber-800 mb-1"><i class="fas fa-chart-line mr-1"></i>Progres Mengaji</p>
                            ${progress.map(p => `<p class="text-xs text-amber-900 font-semibold">${p.level}: ${p.progress} <span class="text-amber-600">(${formatDate(p.lastUpdate)})</span></p>`).join('')}
                        </div>` : ''}

                </div>`;
            document.body.appendChild(modal);
        };

        // === TIDAK HADIR BERSEBAB (MC / peperiksaan / lain-lain) ===
        const persistExcused = () => {
            try { localStorage.setItem('surau_excused', JSON.stringify(window.DB.excusedAbsences || [])); } catch (e) { /* abaikan */ }

        // Borang tanda sebab (modal) — dipanggil dari kad pelajar tidak hadir

        window.saveExcusedForm = (e, studentId, programId) => {

            const s = (DB.students || []).find(x => String(x.id) === String(studentId));
            const p = window.resolveProgram(programId);
            if (!reason || !s || !p) return;
            // Jika pelajar sebenarnya sudah hadir, jangan tanda bersebab
            if ((DB.attendance || []).some(a => String(a.programId) === String(programId) && String(a.studentId) === String(studentId))) {
                showToast('Pelajar ini sudah direkodkan HADIR.', 'error');
                return;

            const record = {
                id: 'exc_' + Date.now(),
                programId: p.id,
                programTitle: p.title,
                studentId: s.id,
                name: s.name,
                dept: s.dept,
                semester: s.semester,
                reason: reason,
                note: note,

            if (!s) { body.innerHTML = ''; return; }

                return { ...ev, status, cls, masa, note: ber ? (ber.note || '') : '' };
