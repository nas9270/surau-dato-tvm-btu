                    <div class="overflow-x-auto border rounded-xl">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50"><tr><th class="px-4 py-2.5 text-left text-xs font-bold text-gray-500 uppercase">Program / Sesi</th><th class="px-4 py-2.5 text-left text-xs font-bold text-gray-500 uppercase">Tarikh</th><th class="px-4 py-2.5 text-center text-xs font-bold text-gray-500 uppercase">Status</th><th class="px-4 py-2.5 text-left text-xs font-bold text-gray-500 uppercase">Masa / Sebab</th></tr></thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                                ${rows.map(r => `<tr><td class="px-4 py-2.5 font-semibold text-gray-900">${r.title}</td><td class="px-4 py-2.5 text-gray-600">${formatDate(r.date)}</td><td class="px-4 py-2.5 text-center"><span class="text-[10px] font-black px-2.5 py-1 rounded-full border ${r.cls}">${r.status}</span></td><td class="px-4 py-2.5 text-xs text-gray-500">${r.masa}${r.note ? ' · ' + r.note : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-400 italic">Tiada sesi direkodkan bagi tempoh ini.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-3">Dicetak pada ${formatDate(new Date().toISOString().split('T')[0])} oleh ${state.currentUser ? state.currentUser.name : ''}</p>

                    ${(() => {
                        // Rekod bacaan mentor-mentee individu ini
                        const prog = (DB.studentProgress || [])
                            .filter(p => String(p.mentee || '').toLowerCase() === String(s.name || '').toLowerCase())
                            .sort((a, b) => String(b.lastUpdate || '').localeCompare(String(a.lastUpdate || '')));
                        if (!prog.length) return '';
                        return `
                    <div class="mt-5">
                        <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2"><i class="fas fa-book-reader mr-1 text-primary-600"></i>Rekod Bacaan (${prog.length})</p>
                        <div class="overflow-x-auto border rounded-xl">
                            <table class="min-w-full divide-y divide-gray-200 text-sm">
                                <thead class="bg-primary-50/60"><tr><th class="px-4 py-2.5 text-left text-xs font-bold text-primary-800 uppercase">Tarikh</th><th class="px-4 py-2.5 text-left text-xs font-bold text-primary-800 uppercase">Tahap</th><th class="px-4 py-2.5 text-left text-xs font-bold text-primary-800 uppercase">Pencapaian</th><th class="px-4 py-2.5 text-left text-xs font-bold text-primary-800 uppercase">Mentor</th></tr></thead>
                                <tbody class="divide-y divide-gray-100 bg-white">
                                    ${prog.map(p => `<tr><td class="px-4 py-2.5 text-gray-600 whitespace-nowrap">${formatDate(p.lastUpdate)}</td><td class="px-4 py-2.5 font-bold text-gray-900">${p.level || '-'}</td><td class="px-4 py-2.5 font-black text-primary-800">${p.progress || '-'}</td><td class="px-4 py-2.5 text-gray-600">${p.mentor || '-'}</td></tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
                    })()}
                </div>`;
        };

        // Cetak laporan individu sahaja (elak bercampur dengan laporan program)
        window.printStudentReport = () => {
            const other = document.getElementById('printable-report');
            if (other) other.id = 'printable-report-off';
            window.print();
            setTimeout(() => { const o = document.getElementById('printable-report-off'); if (o) o.id = 'printable-report'; }, 600);
        };

        // === LAPORAN CARTA SETIAP PROGRAM (tab Laporan & Statistik) ===
        window.renderProgramReport = (pid) => {
            const body = document.getElementById('program-report-body');
            if (!body) return;
            if (!pid) { body.innerHTML = '<p class="text-center text-gray-400 text-sm italic py-10">Pilih program di atas untuk melihat carta kehadiran.</p>'; return; }

            const year = state.filterYear, session = state.filterSession;
            // Laporan kehadiran untuk PELAJAR sahaja (staf dikecualikan) — samakan dengan laporan mingguan
            const sessionStudents = window.getAudienceStudents(null, DB.students.filter(s => String(s.year) === String(year) && s.session === session));
            const attendance = DB.attendance || [];
            const excused = DB.excusedAbsences || [];
            const todayIso = new Date().toLocaleDateString('en-CA');

            let labels = [], hadir = [], tidak = [], bersebab = [], title = '';

            if (pid === 'PMI_ALL') {
                // Keseluruhan minggu PMI dalam semester — minggu hadapan ditanda 0
                const weeks = window.getPMIWeeks(year, session);
                title = `Pembangunan Modal Insan (PMI) — ${weeks.length} Minggu`;
                weeks.forEach(w => {
                    labels.push('M' + w.week);
                    const h = attendance.filter(a => String(a.programId) === w.id).length;
                    const b = excused.filter(e => String(e.programId) === w.id).length;
                    const total = sessionStudents.length;
                    hadir.push(h);
                    bersebab.push(b);
                    tidak.push(w.date <= todayIso ? Math.max(0, total - h - b) : 0); // minggu hadapan: 0
                });
            } else {
                const p = window.resolveProgram(pid);
                if (!p) return;
                title = p.title;
                const target = window.getAudienceStudents(p, sessionStudents);
                const h = attendance.filter(a => String(a.programId) === pid).length;
                const b = excused.filter(e => String(e.programId) === pid).length;
                labels = [formatDate(p.date)];
                hadir = [h]; bersebab = [b]; tidak = [Math.max(0, target.length - h - b)];
            }

            const totalHadir = hadir.reduce((a, b) => a + b, 0);
            const totalTidak = tidak.reduce((a, b) => a + b, 0);
            const totalBersebab = bersebab.reduce((a, b) => a + b, 0);

            // Pecahan mengikut jabatan untuk program/siri ini
            const deptLabels = [], dHadir = [], dTidak = [], dBersebab = [];
            if (pid === 'PMI_ALL') {
                const weeks = window.getPMIWeeks(year, session);
                const pastWeeks = weeks.filter(w => w.date <= todayIso);
                const weekIds = new Set(weeks.map(w => w.id));
                DEPARTMENTS_LIST.forEach(d => {
                    const deptStudents = sessionStudents.filter(s => s.dept === d);
                    if (!deptStudents.length) return;
                    const h = attendance.filter(a => weekIds.has(String(a.programId)) && a.dept === d).length;
                    const b = excused.filter(e => weekIds.has(String(e.programId)) && e.dept === d).length;
                    const t = Math.max(0, deptStudents.length * pastWeeks.length - h - b);
                    deptLabels.push(d); dHadir.push(h); dBersebab.push(b); dTidak.push(t);
                });
            } else {
                const p = window.resolveProgram(pid);
                const target = window.getAudienceStudents(p, sessionStudents);
                DEPARTMENTS_LIST.forEach(d => {
                    const deptTarget = target.filter(s => s.dept === d);
                    if (!deptTarget.length) return;
                    const h = attendance.filter(a => String(a.programId) === pid && a.dept === d).length;
                    const b = excused.filter(e => String(e.programId) === pid && e.dept === d).length;
                    deptLabels.push(d); dHadir.push(h); dBersebab.push(b); dTidak.push(Math.max(0, deptTarget.length - h - b));
                });
            }

            body.innerHTML = `
                <p class="text-sm font-bold text-gray-800 mb-3">${title}</p>
                <div class="grid grid-cols-3 gap-3 mb-4 text-center">
                    <div class="bg-green-50 border border-green-200 rounded-xl p-3"><p class="text-xl font-black text-green-700">${totalHadir}</p><p class="text-[10px] font-bold text-green-700 uppercase">Hadir</p></div>
                    <div class="bg-red-50 border border-red-200 rounded-xl p-3"><p class="text-xl font-black text-red-600">${totalTidak}</p><p class="text-[10px] font-bold text-red-600 uppercase">Tidak Hadir</p></div>
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3"><p class="text-xl font-black text-amber-600">${totalBersebab}</p><p class="text-[10px] font-bold text-amber-600 uppercase">Bersebab</p></div>
                </div>
                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2"><i class="fas fa-calendar-week mr-1"></i>${pid === 'PMI_ALL' ? 'Mengikut Minggu' : 'Program'}</p>
                <div class="h-80 mb-6"><canvas id="chart-program-report"></canvas></div>
                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2 border-t pt-4"><i class="fas fa-layer-group mr-1"></i>Mengikut Jabatan</p>
                <div class="h-72"><canvas id="chart-program-dept"></canvas></div>
                ${pid === 'PMI_ALL' ? '<p class="text-[10px] text-gray-400 mt-2 italic text-center">M1, M2... = Minggu PMI. Minggu yang belum tiba menunjukkan 0.</p>' : ''}
            `;

            setTimeout(() => {
                if (typeof Chart === 'undefined') return;
                if (window.__repChart) { try { window.__repChart.destroy(); } catch (e) {} }
                if (window.__repDeptChart) { try { window.__repDeptChart.destroy(); } catch (e) {} }
                const el = document.getElementById('chart-program-report');
                if (!el) return;
                window.__repChart = new Chart(el, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [
                            { label: 'Hadir', data: hadir, backgroundColor: '#059669', borderRadius: 3, stack: 's' },
                            { label: 'Bersebab', data: bersebab, backgroundColor: '#f59e0b', borderRadius: 3, stack: 's' },
                            { label: 'Tidak Hadir', data: tidak, backgroundColor: '#dc2626', borderRadius: 3, stack: 's' }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } },
                        plugins: { legend: { position: 'bottom', labels: { font: { size: 10, weight: 'bold' }, boxWidth: 12 } } }
                    }
                });

                // Carta mengikut jabatan (bar berkumpulan)
                const elDept = document.getElementById('chart-program-dept');
                if (elDept) {
                    window.__repDeptChart = new Chart(elDept, {
                        type: 'bar',
                        data: {
                            labels: deptLabels,
                            datasets: [
                                { label: 'Hadir', data: dHadir, backgroundColor: '#059669', borderRadius: 4 },
                                { label: 'Bersebab', data: dBersebab, backgroundColor: '#f59e0b', borderRadius: 4 },
                                { label: 'Tidak Hadir', data: dTidak, backgroundColor: '#dc2626', borderRadius: 4 }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { font: { weight: 'bold' } } } },
                            plugins: { legend: { position: 'bottom', labels: { font: { size: 10, weight: 'bold' }, boxWidth: 12 } } }
                        }
                    });
                }
                setTimeout(() => window.forceChartDraw([window.__repChart, window.__repDeptChart]), 400);
                setTimeout(() => window.forceChartDraw([window.__repChart, window.__repDeptChart]), 1200);
            }, 100);
        };

        // === CARTA ORGANISASI: EDITOR (ADMIN) ===
        const persistOrgChart = () => {
            try { localStorage.setItem('surau_orgchart', JSON.stringify(DB.settings.orgChart)); } catch (e) { /* abaikan */ }
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withFailureHandler(function() {}).saveSettings({ orgChart: JSON.stringify(DB.settings.orgChart) });
            }
        };

        const getOrgNodeRef = (key, idx) => {
            const oc = DB.settings.orgChart;
            if (!oc) return null;
            if (key === 'officers' || key === 'ajk') return oc[key][idx];
            return oc[key];
        };

        // Normalisasi pembantu: sokong format lama (string) & baru (objek nama/telefon/gambar)
        window.normHelper = (h) => typeof h === 'string' ? { name: h, phone: '', photo: '' } : { name: h.name || '', phone: h.phone || '', photo: h.photo || '' };

        // Render senarai pembantu dalam modal edit
        window.orgRenderHelpers = () => {
            const list = document.getElementById('org-helpers-list');
            if (!list) return;
            list.innerHTML = (window.__orgHelpers || []).map((h, i) => `
                <div class="flex items-center gap-2 border rounded-xl p-2 bg-gray-50">
                    <label class="cursor-pointer flex-shrink-0" title="Muat naik gambar pembantu">
                        <img id="org-hphoto-${i}" src="${h.photo || ''}" class="w-9 h-9 rounded-full object-cover border border-gray-300 ${h.photo ? '' : 'hidden'}">
                        <span id="org-hicon-${i}" class="w-9 h-9 rounded-full bg-white border border-dashed border-gray-300 text-gray-400 flex items-center justify-center text-xs ${h.photo ? 'hidden' : ''}"><i class="fas fa-camera"></i></span>
                        <input type="file" accept="image/*" class="hidden" onchange="window.orgHelperPhoto(${i}, this)">
                    </label>
                    <input type="text" id="org-hname-${i}" value="${h.name}" placeholder="Nama pembantu" class="flex-1 min-w-0 border rounded-lg px-2 py-1.5 text-xs">
                    <input type="text" id="org-hphone-${i}" value="${h.phone}" placeholder="No. telefon" class="w-28 border rounded-lg px-2 py-1.5 text-xs">
                    <button type="button" onclick="window.orgDelHelper(${i})" class="text-red-400 hover:text-red-600 px-1 flex-shrink-0"><i class="fas fa-times"></i></button>
                </div>`).join('') || '<p class="text-[11px] text-gray-400 italic">Tiada pembantu. Klik "Tambah Pembantu" di bawah.</p>';
        };

        window.orgAddHelperRow = () => {
            window.__orgHelpers.push({ name: '', phone: '', photo: '' });
            window.orgRenderHelpers();
        };

        window.orgDelHelper = (i) => {
            window.__orgHelpers.splice(i, 1);
            window.orgRenderHelpers();
        };

        // Gambar pembantu: mampat 96x96
        window.orgHelperPhoto = (i, input) => {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 96; canvas.height = 96;
                    const side = Math.min(img.width, img.height);
                    canvas.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 96, 96);
                    window.__orgHelpers[i].photo = canvas.toDataURL('image/jpeg', 0.8);
                    window.orgRenderHelpers();
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        };

        // Muat naik & mampatkan gambar kepada 160x160 (base64)
        window.orgPhotoUpload = (input) => {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 160; canvas.height = 160;
                    const ctx = canvas.getContext('2d');
                    // Potong segi empat tengah (square crop)
                    const side = Math.min(img.width, img.height);
                    ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 160, 160);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('org-photo-data').value = dataUrl;
                    const pv = document.getElementById('org-photo-preview');
                    if (pv) { pv.src = dataUrl; pv.classList.remove('hidden'); }
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        };

        window.editOrgNode = (key, idx) => {
            if (!state.currentUser) { showToast('Sila log masuk sebagai admin untuk mengedit.', 'error'); return; }
            const node = getOrgNodeRef(key, idx);
            if (!node) return;
            const isUnit = key === 'ajk';
            // Pembantu pelajar dibolehkan untuk AJK dan Setiausaha/Bendahari
            const hasHelpers = key === 'ajk' || key === 'officers';
            window.__orgHelpers = (node.helpers || []).map(window.normHelper);
            document.getElementById('org-edit-modal')?.remove();
            const modal = document.createElement('div');
            modal.id = 'org-edit-modal';
            modal.className = 'fixed inset-0 z-[100001] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden fade-in-up max-h-[90vh] overflow-y-auto">
                    <div class="bg-primary-900 px-6 py-4 flex items-center justify-between">
                        <p class="text-white font-black text-sm"><i class="fas fa-sitemap mr-2"></i>Edit ${node.role || 'Jawatan'}</p>
                        <button onclick="document.getElementById('org-edit-modal').remove()" class="text-white/70 hover:text-white text-xl leading-none"><i class="fas fa-times"></i></button>
                    </div>
                    <form onsubmit="window.saveOrgNode(event, '${key}', ${idx})" class="p-6 space-y-4">
                        <div class="flex flex-col items-center gap-2">
                            <img id="org-photo-preview" src="${node.photo || ''}" class="w-20 h-20 rounded-full object-cover border-2 border-primary-200 shadow ${node.photo ? '' : 'hidden'}">
                            <input type="hidden" id="org-photo-data" value="${node.photo || ''}">
                            <label class="cursor-pointer text-xs font-bold text-primary-700 bg-primary-50 hover:bg-primary-100 border border-primary-200 px-4 py-2 rounded-xl transition">
                                <i class="fas fa-camera mr-1"></i> Muat Naik Gambar
                                <input type="file" accept="image/*" class="hidden" onchange="window.orgPhotoUpload(this)">
                            </label>
                        </div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">Jawatan</label><input type="text" name="role" value="${node.role || ''}" class="w-full border rounded-xl p-3 text-sm" ${isUnit || key === 'officers' ? '' : 'readonly'} required></div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">Nama Pemegang Jawatan</label><input type="text" name="name" value="${node.name || ''}" placeholder="Nama penuh" class="w-full border rounded-xl p-3 text-sm"></div>
                        <label class="flex items-center gap-2.5 border rounded-xl p-3 bg-blue-50/60 border-blue-200 cursor-pointer">
                            <input type="checkbox" name="isStudent" ${node.isStudent ? 'checked' : ''} class="w-4 h-4 accent-blue-700">
                            <span class="text-xs font-bold text-blue-900">Pemegang jawatan ini adalah <b>pelajar</b> <span class="font-normal text-blue-600">(tanda "(Pelajar)" di bawah nama)</span></span>
                        </label>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">Nota (pilihan)</label><input type="text" name="sub" value="${node.sub || ''}" placeholder="Cth: Pengarah TVETMARA" class="w-full border rounded-xl p-3 text-sm"></div>
                        ${hasHelpers ? `
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1.5">${isUnit ? 'Ahli / Pembantu AJK (Pelajar)' : 'Pembantu (Pelajar)'} — nama, telefon & gambar</label>
                            <div id="org-helpers-list" class="space-y-2"></div>
                            <button type="button" onclick="window.orgAddHelperRow()" class="mt-2 text-xs font-bold text-primary-700 bg-primary-50 hover:bg-primary-100 border border-primary-200 px-3 py-2 rounded-lg transition"><i class="fas fa-plus mr-1"></i> Tambah Pembantu</button>
                        </div>` : ''}
                        <div class="flex gap-3 pt-1">
                            <button type="button" onclick="window.clearOrgNode('${key}', ${idx})" title="Kosongkan nama/gambar jika tersilap isi" class="bg-gray-100 hover:bg-gray-200 text-gray-600 border px-4 py-3 rounded-xl font-bold text-sm transition"><i class="fas fa-eraser"></i></button>
                            ${isUnit ? `<button type="button" onclick="window.deleteOrgUnit(${idx})" title="Padam unit ini" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-3 rounded-xl font-bold text-sm transition"><i class="fas fa-trash"></i></button>` : ''}
                            <button type="submit" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-xl font-bold text-sm transition"><i class="fas fa-save mr-1"></i> Simpan</button>
                        </div>
                    </form>
                </div>`;
            document.body.appendChild(modal);
            if (hasHelpers) window.orgRenderHelpers();
        };

        window.saveOrgNode = (e, key, idx) => {
            e.preventDefault();
            if (!state.currentUser) return;
            const node = getOrgNodeRef(key, idx);
            if (!node) return;
            const form = e.target;
            node.role = form.elements['role'].value.trim().toUpperCase() || node.role;
            node.name = form.elements['name'].value.trim();
            node.sub = form.elements['sub'].value.trim();
            node.photo = document.getElementById('org-photo-data').value || '';
            node.isStudent = !!(form.elements['isStudent'] && form.elements['isStudent'].checked);
            if (Array.isArray(window.__orgHelpers)) {
                // Baca nilai terkini nama & telefon dari baris input
                node.helpers = window.__orgHelpers.map((h, i) => ({
                    name: (document.getElementById('org-hname-' + i)?.value || '').trim(),
                    phone: (document.getElementById('org-hphone-' + i)?.value || '').trim(),
                    photo: h.photo || ''
                })).filter(h => h.name);
            }
            persistOrgChart();
            document.getElementById('org-edit-modal')?.remove();
            showToast('Carta organisasi dikemas kini!', 'success');
            router();
        };

        // Kosongkan kandungan nod (jika tersilap isi) — jawatan dikekalkan
        window.clearOrgNode = (key, idx) => {
            if (!state.currentUser) return;
            const node = getOrgNodeRef(key, idx);
            if (!node) return;
            node.name = '';
            node.sub = '';
            node.photo = '';
            node.isStudent = false;
            node.helpers = [];
            persistOrgChart();
            document.getElementById('org-edit-modal')?.remove();
            showToast('Kandungan jawatan dikosongkan.', 'info');
            router();
        };

        window.addOrgUnit = () => {
            if (!state.currentUser) { showToast('Sila log masuk sebagai admin.', 'error'); return; }
            DB.settings.orgChart.ajk.push({ role: 'AJK BARU', name: '', sub: '', photo: '', helpers: [] });
            persistOrgChart();
            router();
            // Terus buka editor untuk unit baru
            setTimeout(() => window.editOrgNode('ajk', DB.settings.orgChart.ajk.length - 1), 300);
        };

        window.deleteOrgUnit = (idx) => {
            if (!state.currentUser) return;
            DB.settings.orgChart.ajk.splice(idx, 1);
            persistOrgChart();
            document.getElementById('org-edit-modal')?.remove();
            showToast('Unit dipadam dari carta organisasi.', 'info');
            router();
        };

        window.refreshScanAttendees = () => {
            const container = document.getElementById('scan-attendees');
            if (!container) return;
            const programId = state.attendanceProgram;
            const list = (DB.attendance || []).filter(a => String(a.programId) === String(programId));
            container.innerHTML = list.map(a => `<div class="flex items-center gap-3 bg-green-50 rounded-xl p-2.5 border border-green-100"><i class="fas fa-check-circle text-green-600"></i><div class="min-w-0"><p class="font-bold text-gray-900 text-sm truncate">${a.name}</p><p class="text-xs text-gray-500">${a.dept} · ${a.time || ''}</p></div></div>`).join('') || '<p class="text-xs text-gray-400 italic">Belum ada rekod kehadiran.</p>';
        };

        window.captureFace = async () => {
            const studentId = document.getElementById('enroll-student')?.value;
            if (!studentId) { showToast('Sila pilih pelajar dahulu.', 'error'); return; }
            const student = DB.students.find(s => String(s.id) === String(studentId));
            if (!student) { showToast('Rekod pelajar tidak ditemui. Mungkin telah dipadam.', 'error'); return; }
            const statusEl = document.getElementById('enroll-status');
            try {
                await window.loadFaceModels();
                const video = await getCameraStream('enroll-video');
                if (video.readyState < 2) {
                    await new Promise((res, rej) => {
                        const timeout = setTimeout(() => { video.onloadeddata = null; rej(new Error('Kamera terlalu lama untuk dimulakan.')); }, 10000);
                        video.onloadeddata = () => { clearTimeout(timeout); res(); };
                    });
                }
                if (statusEl) statusEl.textContent = 'Mengesan wajah...';

                // Tunggu sedikit untuk kamera stabil
                await new Promise(r => setTimeout(r, 500));
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (!detection) {
                    if (statusEl) statusEl.textContent = 'Tiada wajah dikesan. Sila hadap kamera.';
                    showToast('Tiada wajah dikesan. Sila hadap kamera dengan pencahayaan baik.', 'error');
                    return;
                }

                const descriptor = Array.from(detection.descriptor);
                const formData = { studentId: student.id, name: student.name, dept: student.dept, descriptor: descriptor };

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(function(result) {
                            if (result && result.success) {
                                // Kemaskini memori
                                const idx = DB.faceDescriptors.findIndex(d => String(d.studentId) === String(studentId));
                                if (idx !== -1) DB.faceDescriptors[idx] = { studentId: student.id, name: student.name, dept: student.dept, descriptor: JSON.stringify(descriptor) };
                                else DB.faceDescriptors.push({ studentId: student.id, name: student.name, dept: student.dept, descriptor: JSON.stringify(descriptor) });
                                buildFaceMatcher();
                                showToast('Wajah ' + student.name + ' berjaya didaftarkan!', 'success');
                                stopCamera();
                                router();
                            } else {
                                showToast('Gagal menyimpan wajah.', 'error');
                            }
                        })
                        .withFailureHandler(function(err) {
                            showToast('Ralat: ' + (err.message || err), 'error');
                        })
                        .saveFaceDescriptor(formData);
                } else {
                    // Fallback tempatan
                    const idx = DB.faceDescriptors.findIndex(d => String(d.studentId) === String(studentId));
                    const item = { studentId: student.id, name: student.name, dept: student.dept, descriptor: JSON.stringify(descriptor) };
                    if (idx !== -1) DB.faceDescriptors[idx] = item; else DB.faceDescriptors.push(item);
                    buildFaceMatcher();
                    showToast('Wajah ' + student.name + ' berjaya didaftarkan (tempatan)!', 'success');
                    stopCamera();
                    router();
                }
            } catch (e) {
                if (statusEl) statusEl.textContent = 'Ralat: ' + e.message;
                showToast('Ralat kamera: ' + (e.message || e), 'error');
            }
        };

        // Simpan cap wajah (dikongsi oleh captureFace & enrollFromPhoto)
        window.__persistFaceDescriptor = (student, descriptor) => {
            const formData = { studentId: student.id, name: student.name, dept: student.dept, descriptor: descriptor };
            const item = { studentId: student.id, name: student.name, dept: student.dept, descriptor: JSON.stringify(descriptor) };
            const updLocal = () => {
                const idx = DB.faceDescriptors.findIndex(d => String(d.studentId) === String(student.id));
                if (idx !== -1) DB.faceDescriptors[idx] = item; else DB.faceDescriptors.push(item);
                buildFaceMatcher();
            };
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (result && result.success !== false) {
                            updLocal();
                            showToast('Wajah ' + student.name + ' berjaya didaftarkan!', 'success');
                            stopCamera();
                            router();
                        } else {
                            showToast('Gagal menyimpan wajah.', 'error');
                        }
                    })
                    .withFailureHandler(function(err) {
                        showToast('Ralat: ' + (err.message || err), 'error');
                    })
                    .saveFaceDescriptor(formData);
            } else {
                updLocal();
                showToast('Wajah ' + student.name + ' berjaya didaftarkan (tempatan)!', 'success');
                stopCamera();
                router();
            }
        };

        // Daftar wajah terus dari gambar profil pelajar (tanpa kamera)
        window.enrollFromPhoto = async () => {
            const studentId = document.getElementById('enroll-student')?.value;
            if (!studentId) { showToast('Sila pilih pelajar dahulu.', 'error'); return; }
            const student = DB.students.find(s => String(s.id) === String(studentId));
            if (!student) { showToast('Rekod pelajar tidak ditemui.', 'error'); return; }
            if (!student.image) { showToast('Pelajar ini tiada gambar profil. Muat naik gambar dahulu di halaman Pelajar.', 'error'); return; }
            const statusEl = document.getElementById('enroll-status');
            try {
                showToast('Menganalisis gambar profil... sila tunggu.', 'info');
                if (statusEl) statusEl.textContent = 'Menganalisis gambar profil...';
                await window.loadFaceModels();
                const img = new Image();
                img.crossOrigin = 'anonymous';
                await new Promise((res, rej) => {
                    img.onload = res;
                    img.onerror = () => rej(new Error('Gambar tidak dapat dimuatkan (semak sambungan internet).'));
                    img.src = student.image;
                });
                const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                if (!detection) {
                    if (statusEl) statusEl.textContent = 'Tiada wajah dikesan dalam gambar.';
                    showToast('Tiada wajah dikesan dalam gambar profil. Guna gambar wajah yang jelas menghadap kamera, atau daftar melalui kamera.', 'error');
                    return;
                }
                window.__persistFaceDescriptor(student, Array.from(detection.descriptor));
            } catch (e) {
                if (statusEl) statusEl.textContent = 'Ralat: ' + e.message;
                showToast('Ralat daftar dari gambar: ' + (e.message || e), 'error');
            }
        };

        // Hentikan kamera apabila navigasi keluar dari view imbasan/enroll
        window.addEventListener('hashchange', () => {
            if (scanActive) window.stopFaceScan();
            stopCamera();
        });

        // Sync gilir kehadiran offline bila talian internet kembali
        window.addEventListener('online', () => {
            if (!window.__attQueue || !window.__attQueue.length) return;
            if (typeof google === 'undefined' || !google.script || !google.script.run) return;
            const queue = [...window.__attQueue];
            window.__attQueue = [];
            try { localStorage.setItem('surau_att_queue', '[]'); } catch (e) {}
            queue.forEach(fd => {
                google.script.run.withFailureHandler(function() {
                    // gagal lagi — masuk semula ke gilir
                    window.__attQueue.push(fd);
                    try { localStorage.setItem('surau_att_queue', JSON.stringify(window.__attQueue)); } catch (e) {}
                }).recordAttendance(fd);
            });
            showToast('Talian kembali — ' + queue.length + ' rekod kehadiran offline sedang diselaraskan.', 'info');
        });

        const router = async () => {
            const rawHash = window.location.hash.slice(1) || 'home';
            // Sokong parameter dalam hash (cth: admin-attendance-scan&program=p1)
            const [hash, paramStr] = rawHash.split('&');
            if (paramStr && paramStr.startsWith('program=')) {
                state.attendanceProgram = paramStr.replace('program=', '');
            }
            state.currentRoute = hash;
            const app = document.getElementById('app');

            // Ingat input yang sedang fokus (supaya kursor tidak hilang semasa render semula)
            const ae = document.activeElement;
            window.__activeInputId = (ae && ae.id && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) ? ae.id : null;
            window.__activeInputPos = (ae && typeof ae.selectionStart === 'number') ? ae.selectionStart : null;

            // Hentikan slideshow & countdown apabila navigasi (elak berjalan di latar belakang)
            if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
            if (window.stopCountdowns) window.stopCountdowns();
            
            try {
                let html = '';

                // === PENGAWAL KAWALAN PAPARAN (ditetapkan oleh SUPER_ADMIN/owner) ===
                const PUBLIC_ROUTES = ['home', 'programs', 'gallery', 'students', 'info', 'donate', 'contact'];
                const closedPage = (scope, label) => `
                    <div class="min-h-[60vh] flex items-center justify-center p-6">
                        <div class="bg-white rounded-2xl border shadow-sm p-10 text-center max-w-md w-full">
                            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center"><i class="fas fa-lock text-2xl"></i></div>
                            <h2 class="text-xl font-black text-gray-900 mb-2">Halaman Ditutup Sementara</h2>
                            <p class="text-sm text-gray-500 mb-6">${scope === 'admin' ? 'Modul admin "' + label + '" telah ditutup oleh Owner (Super Admin).' : 'Halaman "' + label + '" telah ditutup oleh pentadbir surau buat masa ini.'}</p>
                            <a href="${scope === 'admin' ? '#admin-dashboard' : '#home'}" class="inline-block bg-primary-600 hover:bg-primary-700 text-white text-sm font-bold px-5 py-2.5 rounded-xl transition"><i class="fas fa-arrow-left mr-1"></i> Kembali</a>
                        </div>
                    </div>`;

                let guardBlocked = false;
                if (hash === 'super-dashboard') {
                    // Khas owner sahaja
                    if (!state.currentUser || (state.currentUser.role || '').toUpperCase() !== 'SUPER_ADMIN') {
                        showToast('Super Dashboard hanya untuk Owner (Super Admin).', 'error');
                        window.location.hash = state.currentUser ? 'admin-dashboard' : 'login';
                        return;
                    }
                } else if (PUBLIC_ROUTES.includes(hash) && !window.isDisplayAllowed('public', hash)) {
                    // Halaman awam ditutup — Super Admin yang log masih boleh pratonton
                    const isSuper = (state.currentUser?.role || '').toUpperCase() === 'SUPER_ADMIN';
                    if (!isSuper) { html = closedPage('public', hash); guardBlocked = true; }
                } else if (hash.startsWith('admin-') && state.currentUser) {
                    const roleUp = (state.currentUser.role || '').toUpperCase();
                    // Guru/Mentor hanya boleh akses halaman yang dibenarkan owner (Super Dashboard)
                    const GURU_ALLOWED = window.getGuruAllowed();
                    if (roleUp === 'GURU' && !GURU_ALLOWED.includes(window.getAdminPageGroup(hash))) {
                        showToast('Akaun Guru tidak mempunyai akses ke halaman itu.', 'error');
                        window.location.hash = GURU_ALLOWED[0] || 'home';
                        return;
                    }
                    const isSuper = roleUp === 'SUPER_ADMIN';
                    const group = window.getAdminPageGroup(hash);
                    if (!isSuper && roleUp !== 'GURU' && !window.isDisplayAllowed('admin', group)) {
                        html = closedPage('admin', group.replace('admin-', ''));
                        guardBlocked = true;
                    }
                }

                if (!guardBlocked)
                if (hash.startsWith('verify-')) html = await Views.VerifyCert(hash.replace('verify-', ''));
                else {
                    switch (hash) {
                        case 'super-dashboard': html = await Views.SuperDashboard(); break;
                        case 'home': html = await Views.Home(); break;
                        case 'programs': html = await Views.Programs(); break;
                        case 'classes': window.location.hash = 'programs'; return; // digabungkan ke Program
                        case 'students': html = await Views.Students(); break;
                        case 'gallery': html = await Views.Gallery(); break;
                        case 'info': html = await Views.Info(); break;
                        case 'contact': html = await Views.Contact(); break;
                        case 'donate': html = await Views.Donate(); break;
                        case 'login': html = await Views.Login(); break;
                        case 'admin-dashboard': html = await Views.AdminDashboard(); break;
                        case 'admin-notifications': html = await Views.AdminNotifications(); break;
                        case 'admin-programs': html = await Views.AdminPrograms(); break;
                        case 'admin-classes': window.location.hash = 'admin-programs'; return; // digabungkan ke Program & Kelas
                        case 'admin-takwim': html = await Views.AdminTakwim(); break;
                        case 'admin-students': html = await Views.AdminStudents(); break;
                        case 'admin-register': html = await Views.AdminRegister(); break;
                        case 'admin-promote': html = await Views.AdminPromote(); break;
                        case 'admin-gallery': html = await Views.AdminGallery(); break;
                        case 'admin-reports': html = await Views.AdminReports(); break;
                        case 'admin-sijil': html = await Views.AdminSijil(); break;
                        case 'admin-users': html = await Views.AdminUsers(); break;
                        case 'admin-settings': html = await Views.AdminSettings(); break;
                        case 'admin-announcements': html = await Views.AdminAnnouncements(); break;
                        case 'admin-donations': html = await Views.AdminDonations(); break;
                        case 'admin-feedback': html = await Views.AdminFeedback(); break;
                        case 'admin-attendance': html = await Views.AdminAttendance(); break;
                        case 'admin-attendance-scan': html = await Views.AdminScan(); break;
                        case 'admin-attendance-report': html = await Views.AdminAttendanceReport(); break;
                        case 'admin-face-enroll': html = await Views.AdminEnroll(); break;
                        default: html = await Views.Home();
                    }
                }
                app.innerHTML = html;
                // Pulihkan fokus & posisi kursor input (cth: carian) selepas render semula
                let focusRestored = false;
                if (window.__activeInputId) {
                    const el = document.getElementById(window.__activeInputId);
                    if (el) {
                        el.focus();
                        focusRestored = true;
                        const pos = window.__activeInputPos;
                        if (typeof pos === 'number') { try { el.setSelectionRange(pos, pos); } catch (e) { /* abaikan */ } }
                    }
                }
                if (!focusRestored) window.scrollTo(0, 0); // jangan lompat ke atas semasa menaip carian
            } catch (err) { 
                console.error(err); 
                app.innerHTML = `<div class="p-10 text-center text-red-600 font-bold bg-white rounded-xl shadow-lg m-10"><i class="fas fa-exclamation-triangle text-3xl mb-2"></i><br>Ralat: ${err.message}</div>`; 
            }
        };

        window.addEventListener('hashchange', router);
        window.onload = router;

        // ================= PWA (Progressive Web App) =================
        // Manifest & Service Worker dijana secara inline (Blob) kerana
        // Apps Script tidak membenarkan fail berasingan manifest.json / sw.js.
        (function initPWA() {
            // Ikon SVG sebagai data URL (digunakan oleh manifest & butang install)
            const ICON_SVG = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='#064e3b'/><text x='50' y='72' font-size='48' text-anchor='middle'>🕌</text></svg>";
            const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(ICON_SVG);

            // 1. Suntik <link rel="manifest"> dengan Blob URL
            try {
                const manifest = {
                    name: 'Sistem Pengurusan Surau Serambi Ar-Raudhah',
                    short_name: 'Surau DATO',
                    description: 'Portal rasmi pengurusan surau TVETMARA Bintulu.',
                    start_url: '.',
                    scope: '.',
                    display: 'standalone',
                    orientation: 'portrait',
                    background_color: '#f8fafc',
                    theme_color: '#064e3b',
                    icons: [
                        { src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
                        { src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }
                    ]
                };
                const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
                const manifestLink = document.createElement('link');
                manifestLink.rel = 'manifest';
                manifestLink.href = URL.createObjectURL(manifestBlob);
                document.head.appendChild(manifestLink);
            } catch (e) { console.warn('Manifest gagal dicipta:', e); }

            // 2. Daftar Service Worker (Blob) untuk cache offline asas
            if ('serviceWorker' in navigator) {
                try {
                    const swCode = `
                        const CACHE_NAME = 'surau-dato-v2';
                        // Senarai aset CDN untuk pra-cache (termasuk model wajah — supaya imbasan berfungsi offline)
                        const PRE_CACHE = [
                            'https://cdn.tailwindcss.com',
                            'https://cdn.jsdelivr.net/npm/chart.js',
                            'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js',
                            'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js',
                            'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css',
                            'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/tiny_face_detector_model-weights_manifest.json',
                            'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/face_landmark_68_model-weights_manifest.json',
                            'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/face_recognition_model-weights_manifest.json'
                        ];
                        self.addEventListener('install', (e) => {
                            e.waitUntil(caches.open(CACHE_NAME).then(c => Promise.allSettled(PRE_CACHE.map(u => c.add(u)))).then(() => self.skipWaiting()));
                        });
                        self.addEventListener('activate', (e) => {
                            e.waitUntil(caches.keys().then(keys => {
                                return Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)));
                            }).then(() => self.clients.claim()));
                        });
                        self.addEventListener('fetch', (e) => {
                            if (e.request.method !== 'GET') return;
                            // Cache-first untuk aset CDN (pantas & offline), network-first untuk halaman
                            const isCdn = e.request.url.startsWith('https://cdn.') || e.request.url.includes('cdnjs.cloudflare.com') || e.request.url.includes('fonts.googleapis.com') || e.request.url.includes('fonts.gstatic.com');
                            e.respondWith(
                                caches.open(CACHE_NAME).then(async (cache) => {
                                    if (isCdn) {
                                        const cached = await cache.match(e.request, { ignoreSearch: true });
                                        if (cached) return cached;
                                        try {
                                            const fresh = await fetch(e.request);
                                            if (fresh && (fresh.status === 200 || fresh.type === 'opaque')) cache.put(e.request, fresh.clone());
                                            return fresh;
                                        } catch (err) { throw err; }
                                    }
                                    try {
                                        const fresh = await fetch(e.request);
                                        if (fresh && fresh.status === 200 && (e.request.url.startsWith('https://cdn.') || e.request.url.startsWith(self.location.origin))) {
                                            cache.put(e.request, fresh.clone());
                                        }
                                        return fresh;
                                    } catch (err) {
                                        const cached = await cache.match(e.request, { ignoreSearch: true });
                                        if (cached) return cached;
                                        throw err;
                                    }
                                })
                            );
                        });
                    `;
                    const swBlob = new Blob([swCode], { type: 'text/javascript' });
                    navigator.serviceWorker.register(URL.createObjectURL(swBlob), { scope: './' }).catch(err => {
                        console.warn('Service Worker gagal didaftarkan:', err);
                    });
                } catch (e) { console.warn('SW init error:', e); }
            }

            // 3. Butang "Install App" (muncul bila browser sokong & belum dipasang)
            let deferredPrompt = null;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                window.showInstallButton();
            });
            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                const btn = document.getElementById('pwa-install-btn');
                if (btn) btn.remove();
                showToast('Aplikasi berjaya dipasang!', 'success');
            });

            window.showInstallButton = () => {
                if (document.getElementById('pwa-install-btn')) return;
                const btn = document.createElement('button');
                btn.id = 'pwa-install-btn';
                btn.className = 'fixed bottom-4 left-4 z-[100000] bg-gray-900 hover:bg-gray-800 text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-2 transition border border-white/10';
                btn.innerHTML = '<i class="fas fa-mobile-alt"></i> Pasang App';
                btn.onclick = async () => {
                    if (!deferredPrompt) {
                        showToast('Buka menu browser dan pilih "Add to Home Screen" untuk pasang.', 'info');
                        return;
                    }
                    deferredPrompt.prompt();
                    const choice = await deferredPrompt.userChoice;
                    if (choice && choice.outcome === 'accepted') {
                        btn.remove();
                    }
                    deferredPrompt = null;
                };
                document.body.appendChild(btn);
                // Auto-sembunyi selepas 15 saat jika tiada tindakan
                setTimeout(() => { if (btn && document.body.contains(btn)) btn.remove(); }, 15000);
            };
        })();
    </script>
</body>
</html>
